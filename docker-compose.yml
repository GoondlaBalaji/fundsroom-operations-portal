services:
  db:
    image: postgres:15-alpine
    container_name: fundsroom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fundsroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fundsroom_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-fundsroom_db}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fundsroom} -d ${POSTGRES_DB:-fundsroom_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fundsroom-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fundsroom}:${POSTGRES_PASSWORD:-fundsroom_secret_password}@db:5432/${POSTGRES_DB:-fundsroom_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-fundsroom-super-secret-jwt-key-2026}
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: production
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: fundsroom-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    depends_on:
      - backend

volumes:
  postgres_data:
