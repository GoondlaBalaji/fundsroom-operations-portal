version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fundsroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundsroom
      POSTGRES_PASSWORD: fundsroom_secret_password
      POSTGRES_DB: fundsroom_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fundsroom -d fundsroom_db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fundsroom-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fundsroom:fundsroom_secret_password@postgres:5432/fundsroom_db?schema=public
      JWT_SECRET: fundsroom-super-secret-jwt-key-2026
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fundsroom-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
